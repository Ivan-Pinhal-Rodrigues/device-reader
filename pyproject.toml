[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "device-reader"
version = "0.1.0"
description = "Read model, capacity, IMEI, and serial number from a connected, unlocked mobile device (iOS and Android)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Ivan Pinhal Rodrigues" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "imei-validator @ git+https://github.com/Ivan-Pinhal-Rodrigues/imei-validator.git@main",
]

[project.optional-dependencies]
hardware = ["pymobiledevice3>=11.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
device-read = "device_reader.cli:main"

[project.urls]
Homepage = "https://github.com/Ivan-Pinhal-Rodrigues/device-reader"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/device_reader"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".superpowers/",
    "docs/superpowers/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
